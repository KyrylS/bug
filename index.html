<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Курс HTML</title>
</head>
<body>
  <header>
    <h1>Курс HTML для початківців</h1>
    <nav>
      <ul>
        <li><a href="index.html">Головна</a></li>
        <li><a href="lessons.html">Уроки</a></li>
        <li><a href="contacts.html">Контакти</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h2>Про курс</h2>
      <img src="students.jpg" alt="Студенти працюють за комп'ютерами під час вивчення HTML">
      <p>
        На курсі ви навчитеся створювати вебсторінки.
      </p>
    </section>

    <section>
      <h2>Реєстрація</h2>
      <form>
        <div>
          <label for="name">Ім'я:</label>
          <input type="text" id="name" name="name">
        </div>
        <br>
        <div>
          <label for="email">Email:</label>
          <input type="email" id="email" name="email">
        </div>
        <br>
        <button type="submit">Зареєструватися</button>
      </form>
    </section>
  </main>
</body>
</html>
<!--
Виправлені проблеми:
1. Додано атрибут lang="uk" до тега <html> — правильно визначає мову документа для скрінрідерів.
2. Змінено заголовок з <h2> на <h1> і виправлено ієрархію заголовків (<h2> замість <h4>) — логічна структура заголовків.
3. Обгорнуто навігацію в <nav> і список <ul>/<li> — зрозуміла і семантична навігація.
4. Замінено незрозумілий текст посилань («Тут», «Натиснути тут») на зрозумілий («Уроки», «Контакти»).
5. Додано атрибут alt до зображення — опис важливого зображення для користувачів скрінрідерів.
6. Додано <label> з for/id для полів форми — правильне підписування полів форми.
7. Змінено type="text" на type="email" для поля електронної пошти — відповідний тип поля.
8. Додано семантичні теги <header>, <main>, <section> — логічно організований основний вміст.
-->
